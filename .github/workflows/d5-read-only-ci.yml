name: D5 Read-only CI

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "RUN_D5_META_RESEARCH.ps1"
      - "tools/mtk_meta/**"
      - "tests/**"
      - "schemas/meta_campaign_findings.schema.json"
      - "reports/D5_META_INVESTIGATION_PROTOCOL.md"
      - ".github/workflows/d5-read-only-ci.yml"
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "RUN_D5_META_RESEARCH.ps1"
      - "tools/mtk_meta/**"
      - "tests/**"
      - "schemas/meta_campaign_findings.schema.json"
      - "reports/D5_META_INVESTIGATION_PROTOCOL.md"
      - ".github/workflows/d5-read-only-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d5-read-only-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate project and evidence manifests
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              project = tomllib.load(stream)
          assert project["project"]["name"] == "ttg-mtk-meta-research-handoff"
          with Path("schemas/meta_campaign_findings.schema.json").open(encoding="utf-8") as stream:
              schema = json.load(stream)
          assert schema.get("$schema")
          print("Project and evidence manifests passed.")
          PY
      - name: Compile analyzer
        run: python -m py_compile tools/mtk_meta/*.py
      - name: Enforce read-only boundary
        run: python tools/mtk_meta/check_d5_read_only.py
      - name: Run fixture tests
        run: python -m unittest discover -s tests -v

  powershell-parse:
    name: Windows PowerShell and prepare-only proof
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse D5 scripts without execution
        id: parse
        continue-on-error: true
        shell: powershell
        run: |
          $files = @(
            "RUN_D5_META_RESEARCH.ps1",
            "tools/mtk_meta/RUN_D5_META_FIVE_RUN_CAMPAIGN.ps1",
            "tools/mtk_meta/D5_META_SUPPORT.ps1",
            "tools/mtk_meta/BUILD_D5_EXPERIMENT_RUNNER.ps1",
            "tools/mtk_meta/PUBLISH_D5_FINDINGS.ps1"
          )
          $report = New-Object System.Collections.Generic.List[string]
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              foreach ($errorRecord in $errors) {
                $report.Add((
                  "{0}:{1}:{2}: {3} | extent={4}" -f `
                    $file,
                    $errorRecord.Extent.StartLineNumber,
                    $errorRecord.Extent.StartColumnNumber,
                    $errorRecord.Message,
                    $errorRecord.Extent.Text
                ))
              }
            }
          }
          if ($report.Count -eq 0) {
            "PowerShell parser passed." | Set-Content powershell-parse-report.txt -Encoding UTF8
            exit 0
          }
          $report | Set-Content powershell-parse-report.txt -Encoding UTF8
          $report | ForEach-Object { Write-Host $_ -ForegroundColor Red }
          exit 1
      - name: Prove prepare-only runner generation
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "d5-fixture"
          New-Item -ItemType Directory -Force `
            (Join-Path $fixture "app\runtime\support\android\mtk") | Out-Null

          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\RUN_D5_META_RESEARCH.ps1 `
            -ProjectRoot $fixture `
            -PrepareOnly `
            -NoPublish `
            -NoBoot `
            -SkipHelperUpdate
          if ($LASTEXITCODE -ne 0) { throw "Prepare-only D5 generation failed." }

          $generated = Get-ChildItem `
            (Join-Path $fixture "audit_shared_runtime") `
            -Recurse -File `
            -Filter "RUN_D5_NATIVE_METACORE_EXPERIMENT.ps1" |
            Select-Object -First 1
          if (!$generated) { throw "Generated D5 experiment runner was not found." }

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $generated.FullName,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            throw "Generated D5 experiment runner did not parse."
          }
          "Prepare-only generated runner passed: $($generated.FullName)" |
            Add-Content powershell-parse-report.txt -Encoding UTF8
      - name: Upload PowerShell proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-parse-report
          path: powershell-parse-report.txt
          if-no-files-found: error
          retention-days: 7
      - name: Fail on PowerShell parse errors
        if: steps.parse.outcome != 'success'
        shell: powershell
        run: exit 1
